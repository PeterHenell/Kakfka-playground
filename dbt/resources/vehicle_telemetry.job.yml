resources:
  jobs:
    vehicle_telemetry_dbt_job:
      name: vehicle_telemetry_dbt_job

      trigger:
        # Rebuild the models every hour. Paused automatically in dev mode.
        periodic:
          interval: 1
          unit: HOURS

      tasks:
        - task_key: dbt_build
          environment_key: dbt
          dbt_task:
            project_directory: ../
            # With a warehouse_id, Databricks writes its own profiles.yml for
            # this run (target `databricks_cluster`) with the warehouse and the
            # catalog and schema below. ../profiles.yml is only for local Spark.
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${resources.schemas.vehicle_telemetry.name}
            commands:
              - >-
                dbt build --vars '{
                "raw_path": "/Volumes/${var.catalog}/${resources.schemas.vehicle_telemetry.name}/${resources.volumes.raw.name}/vehicle_telemetry",
                "descriptor_path": "/Volumes/${var.catalog}/${resources.schemas.vehicle_telemetry.name}/${resources.volumes.raw.name}/vehicle_telemetry/_schema/descriptor_set.desc"
                }'

      environments:
        - environment_key: dbt
          spec:
            environment_version: "5"
            dependencies:
              - dbt-databricks>=1.10.0,<2.0.0
