name: vehicle_telemetry
version: "1.0.0"
config-version: 2

profile: vehicle_telemetry

# Everything dbt-related lives in src/, so the Databricks bundle files
# (databricks.yml, resources/) can sit next to it.
model-paths: ["src/models"]
macro-paths: ["src/macros"]
test-paths: ["src/tests"]
analysis-paths: ["src/analyses"]
seed-paths: ["src/seeds"]
snapshot-paths: ["src/snapshots"]

clean-targets:
  - target
  - dbt_packages

vars:
  # Where the protobuf consumer writes its files. Locally this is the ./data
  # folder in the repo; the Databricks job overrides it with a Unity Catalog
  # Volume path (see resources/vehicle_telemetry.job.yml).
  raw_path: "{{ env_var('RAW_DATA_PATH', '../data/protobuf/vehicle_telemetry') }}"
  # The compiled schema the consumer writes next to the files.
  descriptor_path: "{{ env_var('RAW_DATA_PATH', '../data/protobuf/vehicle_telemetry') }}/_schema/descriptor_set.desc"
  # The protobuf message type to decode.
  message_type: vehicle.v1.VehicleTelemetry

# Views over the raw protobuf files, used as dbt sources (see
# macros/raw_protobuf_views.sql and src/models/sources/).
on-run-start:
  - "{{ create_raw_schema() }}"
  - "{{ create_raw_files_view('vehicle_telemetry') }}"
  - "{{ create_raw_records_view('vehicle_telemetry') }}"

models:
  vehicle_telemetry:
    # Delta Lake tables, as on Databricks. Incremental models that merge, and
    # snapshots, need it.
    +file_format: delta
    staging:
      +materialized: view
    marts:
      +materialized: table

snapshots:
  vehicle_telemetry:
    +file_format: delta
