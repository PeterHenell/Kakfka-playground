# Profile for local development: dbt runs on Apache Spark, inside the dbt
# process itself (method: session, i.e. PySpark; needs Java). dbt looks for
# profiles.yml in the current directory first, so running dbt from this
# folder picks this file up.
#
# Tables are stored as Parquet files under SPARK_DATA_DIR/warehouse, and the
# table catalog (Hive metastore) in SPARK_DATA_DIR/metastore_db.
#
# The spark-protobuf version must match the PySpark version in requirements.txt.
#
# The Databricks job uses dbt_profiles/profiles.yml instead.
vehicle_telemetry:
  target: dev
  outputs:
    dev:
      type: spark
      method: session
      host: localhost  # required by dbt-spark, not used in session mode
      schema: vehicle_telemetry
      threads: 1
      server_side_parameters:
        spark.master: "local[*]"
        spark.driver.memory: 1g
        spark.sql.warehouse.dir: "{{ env_var('SPARK_DATA_DIR', '../data/spark') }}/warehouse"
        spark.hadoop.javax.jdo.option.ConnectionURL: "jdbc:derby:;databaseName={{ env_var('SPARK_DATA_DIR', '../data/spark') }}/metastore_db;create=true"
        # from_protobuf lives in the spark-protobuf module, which isn't part
        # of PySpark. Spark downloads it from Maven Central on first use and
        # caches it in SPARK_IVY_DIR (must be an absolute path).
        spark.jars.packages: org.apache.spark:spark-protobuf_2.13:4.2.0
        spark.jars.ivy: "{{ env_var('SPARK_IVY_DIR', env_var('HOME') ~ '/.ivy2') }}"
        spark.sql.session.timeZone: UTC
        spark.ui.enabled: "false"
