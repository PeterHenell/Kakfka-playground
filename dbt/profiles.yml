# Profile for local development: dbt runs on Apache Spark, inside the dbt
# process itself (method: session, i.e. PySpark; needs Java). dbt looks for
# profiles.yml in the current directory first, so running dbt from this
# folder picks this file up.
#
# Where tables are stored and where the table catalog lives is not set here
# but in Spark's own configuration:
#   - In Docker, spark/spark-defaults.conf (SPARK_CONF_DIR): tables in
#     /data/spark/warehouse, the catalog in the shared metastore-db Postgres,
#     so dbt, spark-sql and the Spark Thrift Server can run at the same time.
#   - On your machine without SPARK_CONF_DIR, Spark's defaults: tables in
#     ./spark-warehouse and the catalog in an embedded Derby database in
#     ./metastore_db, which only one Spark process can open at a time.
#
# The Databricks job doesn't use this file: Databricks writes its own
# profile for the job (see resources/vehicle_telemetry.job.yml).
vehicle_telemetry:
  target: dev
  outputs:
    dev:
      type: spark
      method: session
      host: localhost  # required by dbt-spark, not used in session mode
      schema: vehicle_telemetry
      threads: 1
      server_side_parameters:
        # from_protobuf lives in the spark-protobuf module, which isn't part
        # of PySpark, and Delta Lake (the table format Databricks uses; the
        # incremental model and the snapshot need it) isn't either. Outside
        # Docker, Spark downloads both from Maven Central on first use and
        # caches them in SPARK_IVY_DIR (must be an absolute path). The Docker
        # image (SPARK_CONF_DIR is set) already has the jars, see
        # spark/install-jars.py. spark-protobuf must match the PySpark version
        # in requirements.txt; Delta 4.4.x is for Spark 4.2.
        spark.jars.packages: "{{ '' if env_var('SPARK_CONF_DIR', '') else 'org.apache.spark:spark-protobuf_2.13:4.2.0,io.delta:delta-spark_2.13:4.4.0' }}"
        spark.sql.extensions: io.delta.sql.DeltaSparkSessionExtension
        spark.sql.catalog.spark_catalog: org.apache.spark.sql.delta.catalog.DeltaCatalog
        spark.jars.ivy: "{{ env_var('SPARK_IVY_DIR', env_var('HOME') ~ '/.ivy2') }}"
        spark.sql.session.timeZone: UTC
        spark.ui.enabled: "false"
