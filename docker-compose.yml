# Kafka learning playground
#
#   producer (python) --> Kafka --+--> consumer (python) ---------> Logstash --> Elasticsearch --> Kibana
#                                 +--> parquet-consumer (python) --> ./data/parquet --> dbt + DuckDB
#
# Start everything:   docker compose up -d --build
# Kibana:             http://localhost:5601
# Kafka UI:           http://localhost:8080
# Elasticsearch:      http://localhost:9200
# Kafka (from host):  localhost:9094

name: kafka-playground

services:
  # ---------------------------------------------------------------- Kafka ---
  # Single-node Kafka in KRaft mode (no ZooKeeper). The node acts as both
  # broker and controller.
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is used by containers on the compose network (kafka:9092),
      # EXTERNAL is used by clients on your machine (localhost:9094).
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker => replication factor must be 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Web UI to browse topics, partitions, messages and consumer groups.
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: playground
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ------------------------------------------------------------ ELK stack ---
  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      # Security is disabled to keep the playground simple. Never do this in production.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # By default Elasticsearch stops allocating shards when the disk is 90%
      # full, which happens easily on a laptop. Ignore disk usage here.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  logstash:
    image: logstash:8.17.0
    container_name: logstash
    ports:
      - "8081:8081"
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9600/_node/pipelines/main > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: kibana:8.17.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot job: installs the Elasticsearch index template (so `position` is
  # a geo_point and can be shown on a map) and creates a Kibana data view.
  elk-setup:
    image: curlimages/curl:8.11.1
    container_name: elk-setup
    volumes:
      - ./elk/setup:/setup:ro
    entrypoint: ["/bin/sh", "/setup/setup.sh"]
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------- Python clients ---
  producer:
    build: ./producer
    container_name: producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: vehicle-telemetry
      NUM_VEHICLES: 5
      INTERVAL_SECONDS: 1.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build: ./consumer
    container_name: consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: vehicle-telemetry
      KAFKA_GROUP_ID: elk-writer
      LOGSTASH_URL: http://logstash:8081
    depends_on:
      kafka:
        condition: service_healthy
      logstash:
        condition: service_healthy
      elk-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # Second consumer group: writes the same stream to Parquet files in
  # ./data/parquet, for the dbt project to process.
  parquet-consumer:
    build: ./parquet-consumer
    container_name: parquet-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: vehicle-telemetry
      KAFKA_GROUP_ID: parquet-writer
      OUTPUT_DIR: /data/parquet/vehicle_telemetry
      FLUSH_MAX_MESSAGES: 5000
      FLUSH_INTERVAL_SECONDS: 60
    volumes:
      - ./data:/data
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # dbt on DuckDB, run on demand (it is not started by `docker compose up`):
  #   docker compose run --rm dbt build
  #   docker compose run --rm dbt show --select fct_vehicle_daily
  dbt:
    build: ./dbt
    profiles: ["dbt"]
    working_dir: /dbt
    environment:
      PARQUET_PATH: /data/parquet/vehicle_telemetry
      DUCKDB_PATH: /data/vehicle_telemetry.duckdb
    volumes:
      - ./dbt:/dbt
      - ./data:/data

volumes:
  kafka-data:
  es-data:
