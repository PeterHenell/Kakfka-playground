# Kafka learning playground
#
#   producer (python) --> Kafka --+--> consumer (python) ---------> Logstash --> Elasticsearch --> Kibana
#                                 +--> protobuf-consumer (python) --> ./data/protobuf --> dbt + Spark
#
# Messages are protobuf, defined in schema/proto. The Python images generate
# their protobuf code while being built, so after changing a .proto file run:
#   docker compose up -d --build
#
# Start everything:   docker compose up -d --build
# Kibana:             http://localhost:5601
# Control panel:      http://localhost:8090
# Kafka UI:           http://localhost:8080
# Elasticsearch:      http://localhost:9200
# Kafka (from host):  localhost:9094

name: kafka-playground

services:
  # ---------------------------------------------------------------- Kafka ---
  # Single-node Kafka in KRaft mode (no ZooKeeper). The node acts as both
  # broker and controller.
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is used by containers on the compose network (kafka:9092),
      # EXTERNAL is used by clients on your machine (localhost:9094).
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker => replication factor must be 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Web UI to browse topics, partitions, messages and consumer groups.
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_ADDITIONAL-LOCATION: /config.yml
    volumes:
      - ./kafka-ui/config.yml:/config.yml:ro
      - ./schema/proto:/protofiles:ro
    depends_on:
      kafka:
        condition: service_healthy

  # Pause/resume the producer and consumers, and see produced / consumed /
  # not consumed messages per consumer group.
  control-panel:
    build:
      context: .
      dockerfile: control-panel/Dockerfile
    container_name: control-panel
    ports:
      - "8090:8090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: vehicle-telemetry
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------ ELK stack ---
  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      # Security is disabled to keep the playground simple. Never do this in production.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # By default Elasticsearch stops allocating shards when the disk is 90%
      # full, which happens easily on a laptop. Ignore disk usage here.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  logstash:
    image: logstash:8.17.0
    container_name: logstash
    ports:
      - "8081:8081"
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9600/_node/pipelines/main > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: kibana:8.17.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot job: installs the Elasticsearch index template generated from
  # the .proto files (so e.g. `position` is a geo_point and can be shown on a
  # map) and creates a Kibana data view.
  elk-setup:
    build:
      context: .
      dockerfile: elk/setup/Dockerfile
    container_name: elk-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------- Python clients ---
  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: vehicle-telemetry
      NUM_VEHICLES: 5
      INTERVAL_SECONDS: 1.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: vehicle-telemetry
      KAFKA_GROUP_ID: elk-writer
      LOGSTASH_URL: http://logstash:8081
    depends_on:
      kafka:
        condition: service_healthy
      logstash:
        condition: service_healthy
      elk-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # Second consumer group: archives the same stream as binary protobuf files
  # in ./data/protobuf, for the dbt project (Spark) to decode and process.
  protobuf-consumer:
    build:
      context: .
      dockerfile: protobuf-consumer/Dockerfile
    container_name: protobuf-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: vehicle-telemetry
      KAFKA_GROUP_ID: protobuf-writer
      OUTPUT_DIR: /data/protobuf/vehicle_telemetry
      FLUSH_MAX_MESSAGES: 5000
      FLUSH_INTERVAL_SECONDS: 60
    volumes:
      - ./data:/data
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # dbt on Apache Spark (in-process PySpark), run on demand (it is not
  # started by `docker compose up`):
  #   docker compose run --rm dbt build
  #   docker compose run --rm dbt show --select fct_vehicle_daily
  dbt:
    build:
      context: .
      dockerfile: dbt/Dockerfile
    image: kafka-playground-dbt
    profiles: ["dbt"]
    working_dir: /dbt
    environment:
      RAW_DATA_PATH: /data/protobuf/vehicle_telemetry
      SPARK_DATA_DIR: /data/spark
      # Cache for the spark-protobuf jar, so it is only downloaded once.
      SPARK_IVY_DIR: /data/spark/ivy
    volumes:
      - ./dbt:/dbt
      - ./data:/data

  # Interactive Spark SQL shell on the tables dbt built:
  #   docker compose run --rm spark-sql
  #   spark-sql> select * from vehicle_telemetry.fct_vehicle_daily;
  spark-sql:
    build:
      context: .
      dockerfile: dbt/Dockerfile
    image: kafka-playground-dbt
    profiles: ["dbt"]
    working_dir: /data/spark
    entrypoint:
      - spark-sql
      - --packages
      - org.apache.spark:spark-protobuf_2.13:4.2.0
      - --conf
      - spark.jars.ivy=/data/spark/ivy
      - --conf
      - spark.sql.warehouse.dir=/data/spark/warehouse
      - --conf
      - spark.hadoop.javax.jdo.option.ConnectionURL=jdbc:derby:;databaseName=/data/spark/metastore_db;create=true
      - --conf
      - spark.ui.enabled=false
    volumes:
      - ./data:/data

volumes:
  kafka-data:
  es-data:
