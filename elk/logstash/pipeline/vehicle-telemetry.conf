# Receives vehicle telemetry from the Python consumer over HTTP and indexes it
# into Elasticsearch.
#
# The consumer POSTs a JSON array of messages; the json codec turns each array
# element into its own Logstash event.

input {
  http {
    port => 8081
    codec => json
  }
}

filter {
  # Use the time the vehicle recorded the reading as the event time, instead
  # of the time Logstash received it.
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # The http input adds request metadata (headers, url, client host...).
  # We don't need it in the index.
  mutate {
    remove_field => ["http", "url", "user_agent", "host", "event", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "vehicle-telemetry-%{+YYYY.MM.dd}"
    # Using the producer's message_id as the document id makes writes
    # idempotent: if the consumer re-delivers a message (at-least-once), the
    # document is overwritten instead of duplicated.
    document_id => "%{message_id}"
    data_stream => false
    manage_template => false
  }
}
