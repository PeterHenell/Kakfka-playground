# Spark's logging settings, used by everything that runs Spark in Docker (the
# dbt image copies this file to SPARK_CONF_DIR). This is Spark's default
# configuration (log4j2-defaults.properties), plus the "Delta Lake" section.

rootLogger.level = info
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn
logger.jetty2.name = org.sparkproject.jetty.util.component.AbstractLifeCycle
logger.jetty2.level = error
logger.repl1.name = org.apache.spark.repl.SparkIMain$exprTyper
logger.repl1.level = info
logger.repl2.name = org.apache.spark.repl.SparkILoop$SparkILoopInterpreter
logger.repl2.level = info

# The spark-shell (and PySpark, which dbt uses) log at WARN.
logger.repl.name = org.apache.spark.repl.Main
logger.repl.level = warn

logger.metastore.name = org.apache.hadoop.hive.metastore.RetryingHMSHandler
logger.metastore.level = fatal
logger.metastore2.name = org.apache.hadoop.hive.metastore.ObjectStore
logger.metastore2.level = error

logger.parquet.name = org.apache.parquet.CorruptStatistics
logger.parquet.level = error
logger.parquet2.name = parquet.CorruptStatistics
logger.parquet2.level = error

# Delta Lake: the Hive metastore can't store a Delta table in Hive's own
# format. Spark logs an error with a stack trace every time dbt creates or
# replaces a table, then stores it in its own format, which works. Replacing
# a table logs "Change in the table id detected", and merging into one that
# its RDD "was locally checkpointed". All harmless.
logger.hivealter.name = org.apache.hadoop.hive.metastore.HiveAlterHandler
logger.hivealter.level = fatal
logger.hivecatalog.name = org.apache.spark.sql.hive.HiveExternalCatalog
logger.hivecatalog.level = error
logger.deltalog.name = org.apache.spark.sql.delta.DeltaLog
logger.deltalog.level = error
logger.deltatxn.name = org.apache.spark.sql.delta.OptimisticTransaction
logger.deltatxn.level = error
logger.checkpointed.name = org.apache.spark.rdd.MapPartitionsRDD
logger.checkpointed.level = error
