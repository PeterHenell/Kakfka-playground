# Spark settings shared by everything that runs Spark in Docker: dbt, the
# spark-sql shell and the Jupyter notebooks. The images copy this file to
# /opt/spark-conf and set SPARK_CONF_DIR to it.

spark.master                                      local[*]
spark.driver.memory                               1g
spark.sql.session.timeZone                        UTC

# Tables are stored as files here...
spark.sql.warehouse.dir                           /data/spark/warehouse

# ...and the table catalog (the Hive metastore) lives in Postgres, in the
# metastore-db service. Unlike the embedded Derby database Spark uses by
# default, Postgres can be used by several Spark processes at the same time,
# so dbt, spark-sql and notebooks can run side by side.
spark.sql.catalogImplementation                   hive
spark.hadoop.javax.jdo.option.ConnectionURL       jdbc:postgresql://metastore-db:5432/metastore
spark.hadoop.javax.jdo.option.ConnectionDriverName org.postgresql.Driver
spark.hadoop.javax.jdo.option.ConnectionUserName  hive
spark.hadoop.javax.jdo.option.ConnectionPassword  hive
# The schema is created by metastore/init/*.sql when Postgres starts for the
# first time. Creating it lazily from Spark deadlocks.
spark.hadoop.datanucleus.schema.autoCreateAll     false
spark.hadoop.hive.metastore.schema.verification   false

# from_protobuf lives in the spark-protobuf module (downloaded from Maven
# Central on first use, cached in /data/spark/ivy). Its version must match
# the PySpark version.
spark.jars.packages                               org.apache.spark:spark-protobuf_2.13:4.2.0
spark.jars.ivy                                    /data/spark/ivy
